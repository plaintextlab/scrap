[package]
name = "scrap-android"
version = "0.1.0"
edition = "2021"
description = "JNI bridge exposing scrap-core to the Android app"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
scrap-core = { path = "../../core" }
jni = "0.21"
serde_json = "1"
# No git binary on Android: sync uses libgit2, built from source.
git2 = { version = "0.20", default-features = false, features = ["https", "vendored-libgit2"] }

[target.'cfg(target_os = "android")'.dependencies]
# TLS for HTTPS remotes comes from a bundled OpenSSL on Android.
git2 = { version = "0.20", default-features = false, features = ["https", "vendored-libgit2", "vendored-openssl"] }
# The vendored OpenSSL is built with no-stdio on Android, so it can't read a CA file;
# certificates are parsed in memory and handed to libgit2 directly.
libgit2-sys = "0.18"
openssl-sys = "0.9"
