[workspace]
members = [".", "core", "android/rust"]

[package]
name = "scrap"
version = "0.1.0"
edition = "2021"
description = "A minimal, markdown-based notes app with git sync"
license = "MIT"

[dependencies]
scrap-core = { path = "core" }
# OpenGL (glow) renderer: quick to start and small, unlike the default wgpu.
eframe = { version = "0.36", default-features = false, features = [
    "accesskit", "default_fonts", "glow", "links", "persistence", "wayland", "x11",
] }
# Images in notes: decoding for display, and downscaling when they're added.
egui_extras = { version = "0.36", default-features = false, features = ["file", "image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# Icon font (Phosphor), rendered as text so it scales and themes like the UI.
egui-phosphor = "0.14"
pulldown-cmark = { version = "0.12", default-features = false }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
