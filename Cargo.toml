[package]
name = "scrap"
version = "0.1.0"
edition = "2021"
description = "A minimal, markdown-based notes app with git sync"
license = "MIT"

[lib]
# cdylib is what Android loads; rlib is used by the desktop binary.
crate-type = ["rlib", "cdylib"]

[dependencies]
eframe = { version = "0.31", features = ["persistence"] }
pulldown-cmark = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.15"

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.31", features = ["persistence", "android-native-activity"] }
winit = { version = "0.30", features = ["android-native-activity"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

# Android packaging via cargo-apk (see .github/workflows/release.yml).
[package.metadata.android]
package = "dev.plaintextlab.scrap"
apk_name = "scrap"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "Scrap"

[package.metadata.android.application.activity]
config_changes = "orientation|screenSize|keyboardHidden|keyboard"
# Resize the window so the soft keyboard doesn't cover the text being edited.
window_soft_input_mode = "adjustResize"
